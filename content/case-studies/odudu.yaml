title: "Odudu: an identity provider that proves its own conformance"
kicker: Identity · Open source · Case study
deck: A multi-tenant OAuth and OpenID Connect provider, with an admin console, brandable sign-in pages and an MCP server so agents can operate it under the same capabilities as everyone else.
meta:
  role: Creator, maintainer
  type: Open source (AGPL-3.0)
  stack: TypeScript monorepo, PostgreSQL, Docker
  links:
    - label: Source
      href: https://github.com/wizzywit/odudu
    - label: Documentation
      href: https://wizzywit.github.io/odudu/docs/
    - label: Roadmap
      href: https://wizzywit.github.io/odudu/docs/roadmap/
glance:
  problem: Every product needs sign-in; teams that run their own want to keep their users' data on their own servers.
  approach: Standards first, many tenants kept apart by the database, decisions recorded as ADRs.
  result: The OpenID Foundation conformance suite runs in CI on every change.
decisions: [conformance-ci-gate, agent-permissions]
sections:
  - id: problem
    heading: The problem
    paragraphs:
      - Identity is the one service every product depends on and nobody wants to think about.
      - "[Owner: what pushed you to build Odudu rather than adopt an existing provider, and who it is for.]"
    draft: true
  - id: architecture
    heading: How it fits together
    paragraphs:
      - Apps and agents connect to Odudu. It serves the standard OpenID Connect and OAuth 2.0 endpoints, an admin API with more than a hundred operations, an admin console, and an MCP server.
      - Agents reach the admin API through the MCP server and are held to the same capabilities as everyone else.
  - id: tenants
    heading: Many tenants, one container
    paragraphs:
      - Many tenants run in one container with PostgreSQL, kept apart by the database itself. Every page the server shows, and its mail, can use a tenant's theme and a client's branding, in light and dark.
  - id: console
    heading: The admin console
    paragraphs:
      - The console has a page for every area of the admin API. It is tested in CI with Playwright and axe against WCAG 2.2 AA, in light and dark themes.
  - id: conformance
    heading: Conformance as a test, not a badge
    paragraphs:
      - The OpenID Foundation conformance suite (Config OP) runs in CI. A change that breaks the protocol fails the build, the same as a broken unit test.
  - id: status
    heading: Status
    paragraphs:
      - Odudu is before 1.0, a release candidate, and has not had an independent security review yet.
  - id: differently
    heading: What I would do differently
    paragraphs:
      - "[Owner: an honest paragraph about a trade-off you would revisit. Senior readers trust this section most.]"
    draft: true
