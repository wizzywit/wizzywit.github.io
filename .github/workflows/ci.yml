name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Lint (ESLint, structure, Steiger, jscpd)
        run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Production release check (content, build, built output)
        run: pnpm release:check
      - name: Lighthouse on the production build
        run: |
          export CHROME_PATH="$(node -e "import('@playwright/test').then(m => console.log(m.chromium.executablePath()))")"
          pnpm lighthouse
      - name: Keep the production build as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7
      - name: End-to-end tests (build with drafts, as in local preview)
        run: pnpm e2e
      - name: Keep Playwright results when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results
            playwright-report
          retention-days: 7
